name: CI

on:
  push:
  pull_request:

jobs:
  rom-guard:
    name: ROM safety guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if ROM or oversized files are tracked
        run: |
          set -e
          rom_files=$(git ls-files | grep -iE '\.(smc|sfc)$' || true)
          if [ -n "$rom_files" ]; then
            echo "::error::ROM files must never be committed (legal requirement):"
            echo "$rom_files"
            exit 1
          fi
          # largest legitimate source file is ~56KB; anything over 512KB is suspect
          big_files=$(git ls-files -z | xargs -0 du -b 2>/dev/null | awk '$1 > 524288 {print $2 " (" $1 " bytes)"}')
          if [ -n "$big_files" ]; then
            echo "::error::Unexpectedly large files tracked (possible ROM or binary data):"
            echo "$big_files"
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check all modules
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python wc.py -h

  rom-smoke:
    name: ROM smoke rolls
    runs-on: ubuntu-latest
    # needs a ROM, which is never committed: set the FF3_ROM_URL repository
    # secret to a private download URL (e.g. a signed GCS URL) to enable this job
    env:
      FF3_ROM_URL: ${{ secrets.FF3_ROM_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.FF3_ROM_URL != ''
      - uses: actions/setup-python@v5
        if: env.FF3_ROM_URL != ''
        with:
          python-version: "3.12"
      - name: Download ROM
        if: env.FF3_ROM_URL != ''
        run: |
          curl -fsSL "$FF3_ROM_URL" -o "$RUNNER_TEMP/ff3.smc"
          python -c "import sys; from valid_rom_file import valid_rom_file; sys.exit(0 if valid_rom_file(sys.argv[1]) else 'ROM checksum mismatch')" "$RUNNER_TEMP/ff3.smc"
      - name: Roll every on/off flag
        if: env.FF3_ROM_URL != ''
        run: python tests/rom_smoke.py --rom "$RUNNER_TEMP/ff3.smc"
